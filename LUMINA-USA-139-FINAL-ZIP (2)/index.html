function parsePrice(s){ if(!s) return 0; const m = s.match(/([0-9.]+)/); return m? parseFloat(m[1]):0; }
let filtered = [...PRODUCTS];
function render(list){
  const grid=document.getElementById('grid');
  document.getElementById('count').textContent = `Showing ${list.length} / 139 real products • Real images • Real links`;
  grid.innerHTML = list.map(p=>`
    <div class="card">
      <img src="${p.image_b64}" alt="${p.title.replace(/"/g,'')}" loading="lazy" onerror="this.src='${p.image_url}'">
      <div class="card-body">
        <div class="title">${p.title}</div>
        <div class="prices"><span class="price">${p.discount_price}</span><span class="origin">${p.origin}</span><span class="discount">${p.discount}</span></div>
        <div class="commission">${p.rate}% commission ~ ${p.commission} • ${p.sales} sold • ${p.feedback} feedback</div>
        <div class="meta"><span>ID: ${p.id}</span></div>
        <div class="actions">
          <a class="shop" href="${p.promo}" target="_blank">Shop Now →</a>
          <button class="copy" onclick="navigator.clipboard.writeText('${p.promo}')">Copy Link</button>
        </div>
      </div>
    </div>`).join('');
}
function apply(){
  const q=document.getElementById('search').value.toLowerCase();
  const sort=document.getElementById('sort').value;
  filtered = PRODUCTS.filter(p=> p.title.toLowerCase().includes(q));
  if(sort==='price_asc') filtered.sort((a,b)=>parsePrice(a.discount_price)-parsePrice(b.discount_price));
  if(sort==='price_desc') filtered.sort((a,b)=>parsePrice(b.discount_price)-parsePrice(a.discount_price));
  if(sort==='commission_desc') filtered.sort((a,b)=>parsePrice(b.commission)-parsePrice(a.commission));
  if(sort==='sales_desc') filtered.sort((a,b)=>parseFloat(b.sales)-parseFloat(a.sales));
  if(sort==='discount_desc') filtered.sort((a,b)=>parseFloat(b.discount)-parseFloat(a.discount));
  render(filtered);
}
document.getElementById('search').addEventListener('input',apply);
document.getElementById('sort').addEventListener('change',apply);
function exportCSV(){
  let csv="ProductId,Title,Image,OriginPrice,DiscountPrice,Discount,CommissionRate,Commission,Sales,Feedback,PromoUrl\n";
  filtered.forEach(p=>{ csv+=`\"${p.id}\",\"${p.title.replace(/"/g,'""')}\",\"${p.image_url}\",\"${p.origin}\",\"${p.discount_price}\",\"${p.discount}\",\"${p.rate}\",\"${p.commission}\",\"${p.sales}\",\"${p.feedback}\",\"${p.promo}\"\n`; });
  const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='lumina_usa_139_products.csv'; a.click();
}
function exportJSON(){

}
render(PRODUCTS);
