const grid = document.getElementById('grid');
const search = document.getElementById('search');
const count = document.getElementById('count');

function render(list){
  grid.innerHTML = '';
  list.forEach(p=>{
    const div = document.createElement('div');
    div.className = 'group cursor-pointer';
    div.innerHTML = `
      <div class="aspect-square bg-gray-50 rounded-xl overflow-hidden border">
        <img src="${p.image}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
      </div>
      <div class="pt-2">
        <p class="text-[11px] line-clamp-2 leading-tight">${p.desc}</p>
        <div class="flex gap-2 items-center mt-1">
          <span class="font-bold text-sm">${p.discountPrice}</span>
          <span class="text-[10px] line-through text-gray-400">${p.originPrice}</span>
          <span class="text-[10px] bg-red-100 text-red-600 px-1 rounded">${p.discount}</span>
        </div>
      </div>
    `;
    div.onclick = ()=>openModal(p);
    grid.appendChild(div);
  });
  count.textContent = list.length + ' products';
}

function openModal(p){
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modal-id').textContent = p.id;
  document.getElementById('modal-content').innerHTML = `
    <div class="aspect-square bg-gray-50">
      ${p.video ? `<video src="${p.video}" controls autoplay muted loop class="w-full h-full object-contain"></video>` : `<img src="${p.image}" class="w-full h-full object-contain">`}
    </div>
    <div class="p-5">
      <h2 class="font-bold text-sm leading-snug">${p.desc}</h2>
      <div class="flex items-center gap-3 mt-3">
        <span class="text-2xl font-black">${p.discountPrice}</span>
        <span class="line-through text-gray-400 text-sm">${p.originPrice}</span>
        <span class="bg-black text-white text-xs px-2 py-1 rounded">${p.discount} OFF</span>
      </div>
      <div class="flex gap-4 text-xs text-gray-500 mt-2">
        <span>🔥 ${p.sales} sold</span><span>⭐ ${p.feedback} feedback</span><span class="text-green-600 font-bold">Commission ${p.commission}</span>
      </div>
      ${p.video ? `<a href="${p.video}" target="_blank" class="block mt-3 text-xs text-blue-600 underline">▶️ Open video source</a>` : ''}
      <a href="${p.promoUrl}" target="_blank" class="mt-5 block w-full bg-black text-white text-center py-4 rounded-xl font-bold hover:bg-gray-800">Buy Now - Earn ${p.commission} →</a>
      <p class="text-[10px] text-gray-400 mt-2 text-center">This is your affiliate link from XLS - you earn commission on each sale</p>
    </div>
  `;
}
function closeModal(){document.getElementById('modal').classList.add('hidden');}

search.addEventListener('input', e=>{
  const q = e.target.value.toLowerCase();
  const filtered = products.filter(p=>p.desc.toLowerCase().includes(q));
  render(filtered);
});

render(products);
</script>
